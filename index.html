<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chá Revelação: Quem Tá Chegando?</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f3ed;
        }

        .screen-container {
            width: 95vw;
            max-width: 500px;
            height: 92vh;
            max-height: 900px;
            background-image: url('./background.jpeg?v=3'); /* O v=3 força o celular a baixar a nova versão */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* ----- NOVO: A Placa de Resultado Final ----- */
        #banner-resultado {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            width: 85%;
            background-color: rgba(255, 255, 255, 0.95); /* Fundo branco levemente transparente */
            padding: 20px 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.8em; /* Letra razoavelmente grande */
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
            opacity: 0; /* Começa invisível */
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); /* Animação suave de descida */
            z-index: 10;
        }

        /* O posicionamento da grade de raspadinhas */
        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 65%;
            max-width: 250px;
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
        }

        .scratch-container {
            aspect-ratio: 1; 
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            background-color: #f0eae4; 
        }

        .result-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95em;
            text-align: center;
            padding: 2px;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Times New Roman', Times, serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
        }

        .menino { color: #64b5f6; }
        .menina { color: #f48fb1; }

    </style>
</head>
<body>

    <div class="screen-container">
        <!-- Div que vai exibir a mensagem no topo -->
        <div id="banner-resultado"></div>
        
        <div class="scratch-grid" id="grid"></div>
    </div>

    <script>
        // CONFIGURAÇÃO DO RESULTADO (Mude amanhã!)
        const nomes = [
            "José Miguel", "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa",
            "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa"
        ];

        // LÓGICA DO BANNER FINAL
        let countMenino = nomes.filter(n => n === "José Miguel").length;
        let countMenina = nomes.filter(n => n === "Maria Teresa").length;
        
        const banner = document.getElementById('banner-resultado');
        // O sistema decide o texto do banner automaticamente baseado nos nomes acima
        if (countMenino > countMenina) {
            banner.innerHTML = "É menino!<br>José Miguel vem aí!";
            banner.style.color = "#1976d2"; // Azul mais forte para o destaque
        } else {
            banner.innerHTML = "É menina!<br>Maria Teresa vem aí!";
            banner.style.color = "#c2185b"; // Rosa mais forte para o destaque
        }

        nomes.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('grid');
        let canvasAtivo = null; 
        const todasTelas = []; // Guarda as telas para verificar se foram raspadas

        nomes.forEach((nome) => {
            const container = document.createElement('div');
            container.className = 'scratch-container';

            const textDiv = document.createElement('div');
            textDiv.className = `result-text ${nome === 'José Miguel' ? 'menino' : 'menina'}`;
            textDiv.innerText = nome;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            todasTelas.push(canvas);

            const resizeCanvas = () => {
                const size = container.offsetWidth;
                canvas.width = size;
                canvas.height = size;

                // Camada prateada
                ctx.fillStyle = '#b0bec5'; 
                ctx.fillRect(0, 0, size, size);
                
                // Textura
                ctx.fillStyle = '#a1887f'; 
                for(let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * size, Math.random() * size, Math.random() * (size * 0.04), 0, Math.PI * 2);
                    ctx.fill();
                }
            };
            
            window.addEventListener('load', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 50);

            let isDrawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const iniciarRaspagem = (e) => {
                if (canvasAtivo !== null && canvasAtivo !== canvas) return;
                canvasAtivo = canvas;
                isDrawing = true;
                raspar(e);
            };

            const pararRaspagem = () => {
                isDrawing = false;
                if (canvasAtivo === canvas) {
                    canvasAtivo = null; 
                }
                setTimeout(verificarFimDeJogo, 100);
            };

            const raspar = (e) => {
                if (!isDrawing || canvasAtivo !== canvas) return;
                e.preventDefault(); 
                
                const pos = getPos(e);
                const size = canvas.width;
                ctx.globalCompositeOperation = 'destination-out'; 
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size * 0.18, 0, Math.PI * 2); 
                ctx.fill();
            };

            canvas.addEventListener('mousedown', iniciarRaspagem);
            canvas.addEventListener('mousemove', raspar);
            window.addEventListener('mouseup', pararRaspagem);

            canvas.addEventListener('touchstart', iniciarRaspagem, {passive: false});
            canvas.addEventListener('touchmove', raspar, {passive: false});
            window.addEventListener('touchend', pararRaspagem);

            container.appendChild(textDiv);
            container.appendChild(canvas);
            grid.appendChild(container);
        });

        // Função que verifica se já rasparam o suficiente para mostrar a placa
        let jogoFinalizado = false;
        function verificarFimDeJogo() {
            if (jogoFinalizado) return;
            let circulosRaspados = 0;
            
            todasTelas.forEach(c => {
                const ctx = c.getContext('2d');
                const imgData = ctx.getImageData(0, 0, c.width, c.height);
                const pixels = imgData.data;
                let transparentes = 0;
                
                for (let i = 3; i < pixels.length; i += 16) { 
                    if (pixels[i] < 50) transparentes++;
                }
                
                const totalChecados = Math.floor(pixels.length / 16);
                if (transparentes / totalChecados > 0.35) { 
                    circulosRaspados++;
                }
            });

            // Quando 8 dos 9 círculos são raspados, a mágica acontece
            if (circulosRaspados >= 8) {
                jogoFinalizado = true;
                banner.style.opacity = '1';
                banner.style.transform = 'translateX(-50%) translateY(0)';
            }
        }
    </script>
</body>
</html>
