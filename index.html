<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chá Revelação: Quem Tá Chegando?</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f3ed;
        }

        .screen-container {
            width: 100vw;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            /* AQUI ESTÁ A CORREÇÃO: O código puxa o arquivo que você já subiu! */
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* A grade centralizada na parte inferior */
        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 80%;
            max-width: 280px;
            position: absolute;
            bottom: 10%; /* Ficará bem na área livre abaixo de "Raspe aqui!" */
            left: 50%;
            transform: translateX(-50%);
        }

        .scratch-container {
            aspect-ratio: 1; 
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            background-color: #f0eae4; 
        }

        .result-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95em;
            text-align: center;
            padding: 2px;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Times New Roman', Times, serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
        }

        .menino { color: #64b5f6; }
        .menina { color: #f48fb1; }

    </style>
</head>
<body>

    <div class="screen-container">
        <div class="scratch-grid" id="grid"></div>
    </div>

    <script>
        // CONFIGURAÇÃO DO RESULTADO: 5 ganham, 4 perdem
        const nomes = [
            "Maria Teresa", "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa",
            "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa"
        ];

        nomes.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('grid');
        let canvasAtivo = null; 

        nomes.forEach((nome) => {
            const container = document.createElement('div');
            container.className = 'scratch-container';

            const textDiv = document.createElement('div');
            textDiv.className = `result-text ${nome === 'José Miguel' ? 'menino' : 'menina'}`;
            textDiv.innerText = nome;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            const resizeCanvas = () => {
                const size = container.offsetWidth;
                canvas.width = size;
                canvas.height = size;

                // Camada prateada
                ctx.fillStyle = '#b0bec5'; 
                ctx.fillRect(0, 0, size, size);
                
                // Textura
                ctx.fillStyle = '#a1887f'; 
                for(let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * size, Math.random() * size, Math.random() * (size * 0.04), 0, Math.PI * 2);
                    ctx.fill();
                }
            };
            
            window.addEventListener('load', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 50); // Garante a renderização inicial

            let isDrawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const iniciarRaspagem = (e) => {
                if (canvasAtivo !== null && canvasAtivo !== canvas) return;
                canvasAtivo = canvas;
                isDrawing = true;
                raspar(e);
            };

            const pararRaspagem = () => {
                isDrawing = false;
                if (canvasAtivo === canvas) {
                    canvasAtivo = null; 
                }
            };

            const raspar = (e) => {
                if (!isDrawing || canvasAtivo !== canvas) return;
                e.preventDefault(); 
                
                const pos = getPos(e);
                const size = canvas.width;
                ctx.globalCompositeOperation = 'destination-out'; 
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size * 0.18, 0, Math.PI * 2); 
                ctx.fill();
            };

            canvas.addEventListener('mousedown', iniciarRaspagem);
            canvas.addEventListener('mousemove', raspar);
            window.addEventListener('mouseup', pararRaspagem);

            canvas.addEventListener('touchstart', iniciarRaspagem, {passive: false});
            canvas.addEventListener('touchmove', raspar, {passive: false});
            window.addEventListener('touchend', pararRaspagem);

            container.appendChild(textDiv);
            container.appendChild(canvas);
            grid.appendChild(container);
        });
    </script>
</body>
</html>
