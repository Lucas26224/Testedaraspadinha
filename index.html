<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chá Revelação: Quem Tá Chegando?</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f3ed; /* Cor de fundo suave */
        }

        .screen-container {
            width: 90vw;
            max-width: 400px; /* Largura máxima para celular */
            height: 80vh;
            max-height: 700px; /* Altura máxima */
            /* IMPORTANTE: Esta é a sua imagem inteira incorporada como base64 */
            background-image: url('data:image/jpeg;base64,<!-- [Sua imagem inteira de convite convertida em base64 aqui] -->'); 
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Os textos e os macacões já estão na imagem de fundo. */
        /* Simplificamos os estilos anteriores. */

        /* A grade de raspadinha centralizada abaixo do texto 'Raspe aqui!' da imagem */
        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 75%;
            max-width: 280px;
            position: absolute;
            bottom: calc(20px); /* Ajustado para ficar na área em branco da imagem */
            left: 50%;
            transform: translateX(-50%);
        }

        .scratch-container {
            aspect-ratio: 1; /* Círculos perfeitos */
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            background-color: #f0eae4; /* Cor de fundo suave quando raspado */
        }

        .result-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8em;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Times New Roman', Times, serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: pointer;
            touch-action: none;
        }

        /* Cores dos nomes - Usando tons aquarela suaves */
        .menino { color: #64b5f6; }
        .menina { color: #f48fb1; }

    </style>
</head>
<body>

    <div class="screen-container">
        <!-- Apenas a grade de raspadinha é um filho direto -->
        <div class="scratch-grid" id="grid"></div>
    </div>

    <script>
        // CONFIGURAÇÃO DO RESULTADO (Exemplo: Menina vence por 5x4)
        const nomes = [
            "Maria Teresa", "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa",
            "José Miguel", "Maria Teresa", "José Miguel", "Maria Teresa"
        ];

        // Embaralha as posições aleatoriamente
        nomes.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('grid');
        let canvasAtivo = null; 

        nomes.forEach((nome) => {
            const container = document.createElement('div');
            container.className = 'scratch-container';

            const textDiv = document.createElement('div');
            textDiv.className = `result-text ${nome === 'José Miguel' ? 'menino' : 'menina'}`;
            textDiv.innerText = nome;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Ajustar o canvas ao tamanho do contêiner
            const resizeCanvas = () => {
                const size = container.offsetWidth;
                canvas.width = size;
                canvas.height = size;

                // Desenha a cobertura prateada aquarela suave
                ctx.fillStyle = '#b0bec5'; /* Um cinza azulado mais suave */
                ctx.fillRect(0, 0, size, size);
                
                // Adiciona textura aquarela granulada suave
                ctx.fillStyle = '#a1887f'; /* Marrom aquarela suave */
                for(let i = 0; i < 30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * size, Math.random() * size, Math.random() * (size * 0.04), 0, Math.PI * 2);
                    ctx.fill();
                }
            };
            
            // Chamar inicialmente e quando a janela redimensionar
            window.addEventListener('load', resizeCanvas);
            window.addEventListener('resize', resizeCanvas);

            let isDrawing = false;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const iniciarRaspagem = (e) => {
                if (canvasAtivo !== null && canvasAtivo !== canvas) return;
                canvasAtivo = canvas;
                isDrawing = true;
                raspar(e);
            };

            const pararRaspagem = () => {
                isDrawing = false;
                if (canvasAtivo === canvas) {
                    canvasAtivo = null; 
                }
            };

            const raspar = (e) => {
                if (!isDrawing || canvasAtivo !== canvas) return;
                e.preventDefault(); // Evita que a tela role no celular
                
                const pos = getPos(e);
                const size = canvas.width;
                ctx.globalCompositeOperation = 'destination-out'; // "Apaga" a camada prateada
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, size * 0.18, 0, Math.PI * 2); /* Borracha proporcional */
                ctx.fill();
            };

            // Eventos para Mouse (Computador)
            canvas.addEventListener('mousedown', iniciarRaspagem);
            canvas.addEventListener('mousemove', raspar);
            window.addEventListener('mouseup', pararRaspagem);

            // Eventos para Touch (Celular)
            canvas.addEventListener('touchstart', iniciarRaspagem, {passive: false});
            canvas.addEventListener('touchmove', raspar, {passive: false});
            window.addEventListener('touchend', pararRaspagem);

            // Monta tudo na tela
            container.appendChild(textDiv);
            container.appendChild(canvas);
            grid.appendChild(container);
        });
    </script>
</body>
</html>
